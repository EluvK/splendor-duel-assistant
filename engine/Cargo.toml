[package]
name = "splendor-duel-engine"
version = "0.1.0"
edition = "2024"
description = "Splendor Duel game engine (Rust)"

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10", features = ["serde", "sys_rng"] }
rand_chacha = { version = "0.10", features = ["serde"] }
rand_distr = "0.6"
rayon = { version = "1.10", optional = true }
arrayvec = { version = "0.7", features = ["serde"] }
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
numpy = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
base64 = { version = "0.22", optional = true }
ctrlc = { version = "3.4", optional = true }
tract-onnx = { version = "0.21", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["native"]
native = ["dep:rayon", "dep:ctrlc", "dep:tract-onnx"]
python = ["native", "dep:base64", "dep:numpy", "dep:pyo3"]

[[bin]]
name = "replay_web"
path = "src/bin/replay_web.rs"
required-features = ["native"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["native"]

