[package]
name = "splendor-duel-wasm"
version = "0.1.0"
edition = "2024"
description = "Splendor Duel game engine WebAssembly bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
splendor_duel_engine = { package = "splendor-duel-engine", path = "../engine", default-features = false }
wasm-bindgen = "0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.10", features = ["serde"] }
rand_chacha = { version = "0.10", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
